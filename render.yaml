services:
  - type: web
    name: kafelcenter-erp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_DEBUG
        value: 0
      - key: SHOW_DEMO_CREDENTIALS
        value: 0
