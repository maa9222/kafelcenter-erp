# ==========================================================
# KafelCenter ERP - Nginx Konfiguratsiya Fayli
# Ushbu faylni /etc/nginx/sites-available/kafel manziliga joylashtiring
# ==========================================================

server {
    listen 80;
    listen [::]:80;

    # O'zingizning domeningizni yozing (masalan: kafelcenter.uz www.kafelcenter.uz)
    server_name SIZNING_DOMENINGIZ.UZ www.SIZNING_DOMENINGIZ.UZ;

    # Katta hajmdagi rasmlar yuklashga ruxsat berish (maksimal 20MB)
    client_max_body_size 20M;

    # Statik fayllarni (CSS, JS, ikonkalarni) to'g'ridan-to'g'ri Nginx orqali uzatish
    location /static/ {
        alias /var/www/kafel_magazin/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Yuklangan kafel rasmlari va QR-kodlarni Nginx orqali uzatish
    location /uploads/ {
        alias /var/www/kafel_magazin/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Barcha dinamik sahifalar va API so'rovlarini Gunicorn (Flask) ga yo'naltirish
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}
